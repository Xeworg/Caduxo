[package]
name = "caduxo"
version = "0.1.0"
description = "Caduxo - Local-first product expiry tracker"
authors = ["Caduxo"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "caduxo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"

# CSV (Slice 10a)
csv = "1.3"

# PDF (Slice 11b)
printpdf = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }

# Blocking SQLite read (backup file inspection — no async needed)
rusqlite = "0.32"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Futures utilities for migration stream iteration (multi-statement execution fix).
futures-core = "0.3"
futures-util = "0.3"

# SHA-256 for unit audit banner signature
sha2 = "0.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# App directories
dirs = "6"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
rand = "0.8"
futures-core = "0.3"
futures = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
