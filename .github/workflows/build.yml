name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tarball: caduxo_ubuntu.tar.gz
          - os: windows-latest
            tarball: caduxo_windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux — install Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            gdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            libappindicator3-dev \
            patchelf

      - name: Linux — install linuxdeploy (AppImage bundler)
        if: runner.os == 'Linux'
        run: |
          linuxdeploy_base="https://github.com/linuxdeploy/linuxdeploy/releases/download"
          linuxdeploy_url="$linuxdeploy_base/continuous/linuxdeploy-x86_64.AppImage"
          wget -q -O linuxdeploy.AppImage "$linuxdeploy_url"
          chmod +x linuxdeploy.AppImage
          sudo mv linuxdeploy.AppImage /usr/local/bin/linuxdeploy

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript / Svelte type check
        run: npm run check

      - name: Tauri production build
        run: npm run tauri build

      - name: Collect Linux bundle artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/caduxo artifacts/
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          tar -czf ${{ matrix.tarball }} -C artifacts .
        shell: bash

      - name: Collect Windows bundle artifacts
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item `
            src-tauri\target\release\Caduxo.exe `
            artifacts\ -ErrorAction Stop
          Copy-Item `
            src-tauri\target\release\bundle\msi\*.msi `
            artifacts\ -ErrorAction Stop
          Copy-Item `
            src-tauri\target\release\bundle\nsis\*.exe `
            artifacts\ -ErrorAction Stop
          Compress-Archive -Path artifacts\* `
            -DestinationPath ${{ matrix.tarball }}
        shell: powershell

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v5
        with:
          name: caduxo-bundles-${{ runner.os }}
          path: ${{ matrix.tarball }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: caduxo-bundles-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
